name: Window test and price check

# Actions tab → "Window test and price check" → Run workflow
# Writes report/SENSITIVITY.md and report/VXUS_CHECK.md and commits them.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers for the window/threshold test"
        default: "SPY, TLT, HYG, TSLA, VXUS"
      check_ticker:
        description: "Ticker whose hand-recorded prices are checked"
        default: "VXUS"
      readings:
        description: "CSV of your readings (date,close)"
        default: "data/vxus_readings_oct2026.csv"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Window and threshold test
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          uv run python scripts/sensitivity.py --tickers "$TICKERS" --out report/SENSITIVITY.md 2>&1 | grep -v "Warning\|^See https\|\.set_index\|\.sort_index\|\.rename\|\.drop" || true
          cat report/SENSITIVITY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check hand-recorded prices
        env:
          CHECK: ${{ inputs.check_ticker }}
          READINGS: ${{ inputs.readings }}
        run: |
          uv run python scripts/vxus_check.py --ticker "$CHECK" --readings "$READINGS" --out report/VXUS_CHECK.md 2>&1 | grep -v "Warning\|^See https\|\.set_index\|\.sort_index\|\.rename\|\.drop" || true
          cat report/VXUS_CHECK.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/SENSITIVITY.md report/VXUS_CHECK.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update window test and price check"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
