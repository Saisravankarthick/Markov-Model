name: Markov regime

# Run from the Actions tab: Actions → "Markov regime" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "yfinance symbol, e.g. SPY, AAPL, BTC-USD, ^NSEI (leave blank to use a CSV)"
        default: "SPY"
      csv:
        description: "Path to a CSV in this repo with date + close columns (used only if ticker is blank)"
        default: ""
      years:
        description: "Years of history (ticker only)"
        default: "10"
      window:
        description: "Rolling-return window in days"
        default: "20"
      threshold:
        description: "Regime threshold as a fraction (0.05 = ±5%)"
        default: "0.05"
      hmm:
        description: "Also fit the Hidden Markov Model"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  regime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Run regime model
        # Inputs are passed through env, never interpolated into the script.
        env:
          TICKER: ${{ inputs.ticker }}
          CSV: ${{ inputs.csv }}
          YEARS: ${{ inputs.years }}
          WINDOW: ${{ inputs.window }}
          THRESHOLD: ${{ inputs.threshold }}
          HMM: ${{ inputs.hmm }}
        run: |
          args=(--years "$YEARS" --window "$WINDOW" --threshold "$THRESHOLD" --json)
          if [ -n "$TICKER" ]; then
            args+=(--ticker "$TICKER")
          elif [ -n "$CSV" ]; then
            args+=(--csv "$CSV")
          else
            echo "::error::Set either ticker or csv."
            exit 1
          fi
          [ "$HMM" = "true" ] || args+=(--no-hmm)
          status=0
          uv run scripts/markov_regime.py "${args[@]}" > regime.json || status=$?
          python3 scripts/summarize.py regime.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload JSON result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-result
          path: regime.json
          if-no-files-found: ignore
