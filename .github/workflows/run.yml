name: Run Markov skill

# Actions tab → "Run Markov skill" → Run workflow
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "One or more yfinance symbols, comma or space separated (e.g. SPY, AAPL, BTC-USD)"
        default: "SPY"
      years:
        description: "Years of daily history"
        default: "10"
      window:
        description: "Rolling-return window in trading days"
        default: "20"
      threshold:
        description: "Regime threshold as a fraction (0.02 = ±2%)"
        default: "0.02"
      hmm:
        description: "Also fit the Hidden Markov Model"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install HMM extension (optional)
        run: |
          uv sync
          uv pip install "hmmlearn>=0.3" && echo true > .hmm_available || echo false > .hmm_available
      - name: Run
        env:
          TICKER: ${{ inputs.ticker }}
          YEARS: ${{ inputs.years }}
          WINDOW: ${{ inputs.window }}
          THRESHOLD: ${{ inputs.threshold }}
          HMM: ${{ inputs.hmm }}
        run: |
          mkdir -p results
          IFS=', ' read -ra tickers <<< "$TICKER"
          fail=0
          {
            echo "## Markov regime — window $WINDOW, threshold ±$THRESHOLD, $YEARS years"
            echo
            echo "| Ticker | Rows | Long-run Bear | Long-run Sideways | Long-run Bull | Bear→Bear | Bull→Bull | Sharpe | Max DD |"
            echo "|---|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for t in "${tickers[@]}"; do
            [ -n "$t" ] || continue
            out="results/$t.txt"
            args=(--ticker "$t" --years "$YEARS" --window "$WINDOW" --threshold "$THRESHOLD")
            [ "$HMM" = "true" ] || args+=(--no-hmm)
            echo "::group::$t"
            if uv run python -m markov_hedge_fund_method.run "${args[@]}" > "$out" 2>/dev/null; then
              cat "$out"
              awk -v t="$t" '
                /fetched/ {rows=$2}
                /Persistence diagonal/ {s="p"; next}
                /Stationary distribution/ {s="s"; next}
                /^$/ {s=""}
                s=="p" && /->/ {if ($1=="Bear") pb=$NF; else if ($1=="Bull") pu=$NF}
                s=="s" && /:/ {if ($1=="Bear:") sb=$NF; else if ($1=="Sideways:") ss=$NF; else if ($1=="Bull:") su=$NF}
                /Sharpe/ {sh=$NF}
                /Max drawdown/ {dd=$NF}
                END {printf "| %s | %s | %s | %s | %s | %s | %s | %s | %s |\n", t, rows, sb, ss, su, pb, pu, sh, dd}
              ' "$out" >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$out"
              echo "| $t | failed | | | | | | | |" >> "$GITHUB_STEP_SUMMARY"
              fail=$((fail + 1))
            fi
            echo "::endgroup::"
            sleep 2
          done
          {
            echo
            echo "_Backtests are historical, not forward-looking, and exclude trading costs. Full output per ticker is in the job log and the \`results\` artifact._"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -lt "${#tickers[@]}" ]
      - name: Draw charts
        env:
          TICKER: ${{ inputs.ticker }}
          YEARS: ${{ inputs.years }}
          WINDOW: ${{ inputs.window }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          uv run --with matplotlib python scripts/charts.py \
            --tickers "$TICKER" --years "$YEARS" --window "$WINDOW" --threshold "$THRESHOLD" \
            --out charts 2>&1 | grep -v "Warning\|^See https\|df\.\|data\." || true
          n=$(ls charts/*.png 2>/dev/null | wc -l)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Charts:** $n image(s) — download the \`charts\` artifact at the bottom of this page." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charts
          path: charts/
          if-no-files-found: ignore
