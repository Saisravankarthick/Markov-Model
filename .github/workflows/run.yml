name: Run Markov skill

# Actions tab → "Run Markov skill" → Run workflow
# Commits report/REPORT.md (table + charts) back to the repo.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "One or more yfinance symbols, comma or space separated (e.g. SPY, AAPL, BTC-USD)"
        default: "VOO, VTI, EWT, SHY, SGOV, SCHP, IEF, VXUS, QQQM, AAPL, GOOG, AAAU, MSFT, NVDA, TSLA, SPOT, SNDK, NKE, MA, XLE, RSP, VTV, SCHD, HYG, TLT, VGIT, XLU"
      years:
        description: "Years of daily history"
        default: "10"
      window:
        description: "Rolling-return window in trading days"
        default: "20"
      threshold:
        description: "Regime threshold as a fraction (0.02 = ±2%)"
        default: "0.02"
      hmm:
        description: "Also fit the Hidden Markov Model (shown in the job log)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install HMM extension (optional)
        run: |
          uv sync
          uv pip install "hmmlearn>=0.3" && echo true > .hmm_available || echo false > .hmm_available
      - name: Run the skill on each ticker (full output in this log)
        env:
          TICKER: ${{ inputs.ticker }}
          YEARS: ${{ inputs.years }}
          WINDOW: ${{ inputs.window }}
          THRESHOLD: ${{ inputs.threshold }}
          HMM: ${{ inputs.hmm }}
        run: |
          IFS=', ' read -ra tickers <<< "$TICKER"
          for t in "${tickers[@]}"; do
            [ -n "$t" ] || continue
            args=(--ticker "$t" --years "$YEARS" --window "$WINDOW" --threshold "$THRESHOLD")
            [ "$HMM" = "true" ] || args+=(--no-hmm)
            echo "::group::$t"
            uv run python -m markov_hedge_fund_method.run "${args[@]}" 2>/dev/null || echo "FAILED: $t"
            echo "::endgroup::"
          done
      - name: Draw charts and build the report
        env:
          TICKER: ${{ inputs.ticker }}
          YEARS: ${{ inputs.years }}
          WINDOW: ${{ inputs.window }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          rm -rf report && mkdir -p report/charts
          uv run --with matplotlib python scripts/charts.py \
            --tickers "$TICKER" --years "$YEARS" --window "$WINDOW" --threshold "$THRESHOLD" \
            --out report/charts --stats report/stats.json 2>&1 | grep -v "Warning\|^See https\|\.set_index\|\.sort_index\|\.rename\|\.drop" || true
          python3 scripts/report.py report/stats.json report/REPORT.md
          grep -v '^!\[' report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Update report: ${{ inputs.ticker }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
